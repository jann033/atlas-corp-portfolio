function newForm(editId){const p=editId?patient(editId):null;return{step:0,id:editId||'',dirty:false,name:p?.name||'',dob:p?.dob||'',sex:p?.sex||0,phone:p?.phone||'+998 ',username:p?.username||'',parentName:p?.parentName||'',parentPhone:p?.parentPhone||'+998 ',types:p?[...p.types]:[],complaints:p?.complaints||'',allergies:p?.allergies||'',chronic:p?[...p.chronic]:[],source:p?.source||T.sources[0],doctor:p?.doctor||'d1',date:today(),time:''}}

function appointmentFields(data,prefix){return `<h3 class="mb">${T.selectDoctor}</h3>${doctors.map((d,i)=>`<button type="button" class="doctor ${data.doctor===d.id?'selected':''}" data-act="${prefix}Doctor:${d.id}">${avatar(d)}<div class="grow"><h3>${d.name}</h3><p>${d.specialty}</p></div><span class="radio"></span></button>`).join('')}<h3 class="mt mb">${T.date}</h3>${daysHTML(data.date,14,today(),prefix+'Date')}<h3 class="mt mb">${T.time}</h3><div class="slots">${Array.from({length:18},(_,i)=>`${String(9+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`).map(t=>`<button type="button" class="slot ${data.time===t?'selected':''}" data-act="${prefix}Time:${t}" ${isBusy(data.doctor,data.date,t)?'disabled':''}>${t}</button>`).join('')}</div><p class="small muted mt">${T.busyHint}</p><p id="slotError" class="small danger mt"></p>`}

function patientHome(){return `<div class="intro"><p>${T.patientDemo} · ${esc(db.patients[0]?.name||T.doctor)}</p><h1>${T.patientWelcome.replace('\n','<br>')}</h1><p>${T.patientHint}</p></div><div class="hero"><span class="label">${T.clinic}</span><h2>${T.onlineBook}</h2>${btn(T.book,'patientBook','soft','calendar')}${icon('tooth','decor')}</div><div class="section-title"><h2>${T.services}</h2></div>${Object.entries(T.types).map(([k,v])=>`<button class="card service" data-act="service:${k}"><span class="avatar">${icon('tooth')}</span><div class="grow"><h3>${v[0]}</h3><p>${T.directions[v[1]]}</p><div class="price">${T.from} ${money(v[2])}</div></div>${icon('arrow')}</button>`).join('')}`}
function successPage(){return `<div class="success"><div class="success-mark">${icon('check')}</div><h1>${T.success}</h1><p>${T.successHint}</p><div class="stack">${btn(T.openCard,'patient:'+successId,'primary full')}${btn(T.addMore,'new','full')}</div></div>`}
function cleanButtons(){if(can('6.0')&&tg.MainButton){if(mainHandler)tg.MainButton.offClick(mainHandler);tg.MainButton.hide()}if(can('7.10')&&tg.SecondaryButton){if(secondHandler)tg.SecondaryButton.offClick(secondHandler);tg.SecondaryButton.hide()}if(can('6.1')&&tg.BackButton){if(backHandler)tg.BackButton.offClick(backHandler);tg.BackButton.hide()}mainHandler=secondHandler=backHandler=null;formAction=secondaryAction=null;$('#footer').innerHTML=''}
function configureButtons(){cleanButtons();let nested=/^\/(patient\/|new|book|success)/.test(route);if(nested&&can('6.1')){backHandler=back;tg.BackButton.onClick(backHandler);tg.BackButton.show()}if(route==='/new'){formAction=()=>submitForm(false);secondaryAction=form.step===2?()=>submitForm(true):null;buttons(form.step<2?T.next:form.id?T.save:T.book,formAction,secondaryAction?T.noBooking:'',secondaryAction)}if(route==='/book'&&booking?.step===1){formAction=saveBooking;buttons(T.book,formAction)}if(form?.dirty&&route==='/new')tgCall('6.2','enableClosingConfirmation');else tgCall('6.2','disableClosingConfirmation')}
function buttons(label,fn,second='',secondFn=null){let mainNative=can('6.0')&&tg.MainButton,secondaryNative=can('7.10')&&tg.SecondaryButton;if(mainNative){mainHandler=fn;tg.MainButton.setParams({text:label,color:'#12b5a6',text_color:'#ffffff',is_active:true,is_visible:true});tg.MainButton.onClick(mainHandler)}if(second&&secondaryNative){secondHandler=secondFn;tg.SecondaryButton.setParams({text:second,is_visible:true,is_active:true});tg.SecondaryButton.onClick(secondHandler)}if(!mainNative||second&&!secondaryNative)$('#footer').innerHTML=`<div class="form-footer">${second&&!secondaryNative?btn(second,'secondary'):''}${!mainNative?btn(label,'main','primary'):''}</div>`}
function render(){route=location.hash.slice(1)||'/home';if(!/^\/(home|patients|patient\/[^/]+|new|schedule|more|book|success|my-treatment)$/.test(route)){go('/home');return}closeSheet(false);const nested=/^\/(patient\/|new|book|success|my-treatment)/.test(route);$('#header').innerHTML=`<div class="row gap8">${nested&&!(can('6.1'))?`<button class="icon-btn" data-act="back" aria-label="${T.back}">${icon('back')}</button>`:''}<div class="brand">${icon('tooth','brand-mark')}<div>${T.brand}<small>DENTAL CARE</small></div></div><div class="row gap4"><span class="demo">${T.demo}</span><button class="icon-btn" data-act="more" aria-label="${T.more}">${icon('user')}</button></div>`;let html=route==='/home'?home():route==='/patients'?patientsPage():route.startsWith('/patient/')?detail(patient(route.split('/')[2])):route==='/new'?formPage():route==='/book'?bookingPage():route==='/schedule'?schedulePage():route==='/more'?morePage():route==='/my-treatment'?db.patients[0]?treatmentHTML(db.patients[0]):empty(T.noResults,''):successPage();$('#main').innerHTML=`<div class="page">${html}</div>`;const formRoute=route==='/new'||route==='/book';$('#nav').style.display=formRoute?'none':'flex';const tabs=mode==='staff'?[['home',T.home,'home'],['patients',T.patients,'users'],['schedule',T.schedule,'calendar'],['more',T.more,'more']]:[['home',T.services,'home'],['my-treatment',T.myTreatment,'tooth'],['more',T.more,'more']];$('#nav').innerHTML=tabs.map(([k,t,i])=>`<button class="${route==='/'+k?'active':''}" data-act="${k}" ${route==='/'+k?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('');configureButtons()}
function toast(msg){$('#toasts').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toasts').innerHTML='',3000)}
function showSheet(title,body,foot='',kind=''){lastFocus=document.activeElement;sheetKind=kind;$('#overlay').innerHTML=`<div class="sheet-overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><div class="handle"></div><div class="row between"><h2>${title}</h2><button class="icon-btn" data-act="close" aria-label="${T.close}">${icon('x')}</button></div></div><div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:''}</section></div>`;document.body.style.overflow='hidden';$('.app').inert=true;tgCall('7.7','disableVerticalSwipes');if(can('6.0'))tg.MainButton?.hide();if(can('7.10'))tg.SecondaryButton?.hide();if(can('6.1')){if(backHandler)tg.BackButton.offClick(backHandler);backHandler=()=>closeSheet();tg.BackButton.onClick(backHandler);tg.BackButton.show()}$('.sheet-head button').focus();let y=0;$('.sheet-head').addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});$('.sheet-head').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-y>65)closeSheet()},{passive:true})}
function closeSheet(restore=true){if(!$('#overlay').innerHTML)return;$('#overlay').innerHTML='';document.body.style.overflow='';$('.app').inert=false;sheetKind='';tgCall('7.7','enableVerticalSwipes');if(restore){configureButtons();lastFocus?.isConnected&&lastFocus.focus()}}
let confirmCallback=null;function ask(message,cb){if(can('6.2')){tg.showConfirm(message,ok=>{if(ok)cb()});return}confirmCallback=cb;showSheet(T.confirm,`<p class="small" style="line-height:1.8;margin:10px 0">${esc(message)}</p>`,btn(T.cancel,'close')+btn(T.confirm,'confirm','primary'),'confirm')}
function filterSheet(){filterDraft=structuredClone(filters);drawFilters()}
function filterOptions(k,obj){return `<div class="sheet-options">${Object.entries(obj).map(([v,t])=>`<button class="chip ${String(filterDraft[k])===v?'active':''}" data-act="filterValue:${k}:${v}">${t}</button>`).join('')}</div>`}
function filterBody(){return `${Object.entries(T.directions).map(([dir,label])=>`<h3>${label}</h3><div class="sheet-options">${Object.entries(T.types).filter(([,v])=>v[1]===dir).map(([k,v])=>`<button class="chip ${filterDraft.types.includes(k)?'active':''}" data-act="filterType:${k}">${v[0]}</button>`).join('')}</div>`).join('')}<h3>${T.stage}</h3>${filterOptions('stage',Object.fromEntries(T.stages.map((x,i)=>[i,x])))}<h3>${T.doctorLabel}</h3>${filterOptions('doctor',Object.fromEntries(doctors.map(d=>[d.id,d.name])))}<h3>${T.age}</h3>${filterOptions('age',T.ages)}<h3>${T.payment}</h3>${filterOptions('payment',T.payments)}<h3>${T.nextVisit}</h3>${filterOptions('visit',T.visits)}`}
function drawFilters(){const scroll=$('.sheet-body')?.scrollTop||0;showSheet(T.filters,filterBody(),btn(T.reset,'filterReset')+btn(T.show(filtered(filterDraft).length),'filterApply','primary'),'filters');$('.sheet-body').scrollTop=scroll}
function phoneMask(v){let n=v.replace(/\D/g,'');if(n.startsWith('998'))n=n.slice(3);n=n.slice(0,9);return '+998 '+(n.length?'('+n.slice(0,2):'')+(n.length>=2?') ':'')+n.slice(2,5)+(n.length>5?'-'+n.slice(5,7):'')+(n.length>7?'-'+n.slice(7,9):'')}
function collectForm(){if(!form)return;const f=$('#patientForm');if(!f)return;for(const el of f.elements){if(!el.name)continue;if(el.name==='chronic')continue;form[el.name]=el.name==='sex'?+el.value:el.value}if(form.step===1)form.chronic=[...f.querySelectorAll('[name=chronic]:checked')].map(x=>x.value)}
function markErrors(errors){$$('.form-field').forEach(el=>{el.classList.remove('invalid');el.querySelector('.error')&&(el.querySelector('.error').textContent='')});for(const [k,msg]of Object.entries(errors)){const el=$(`[data-field="${k}"]`);if(el){el.classList.add('invalid');el.querySelector('.error').textContent=msg}}if(Object.keys(errors).length){haptic('notificationOccurred','error');$('.invalid')?.scrollIntoView({behavior:low?'instant':'smooth',block:'center'});$('.invalid input')?.focus();return false}return true}
function validatePersonal(){const e={};if(form.name.trim().split(/\s+/).length<2)e.name=T.nameError;if(!form.dob||form.dob>today()||form.dob<'1900-01-01'||!Number.isFinite(age(form.dob)))e.dob=T.dobError;if(form.phone.replace(/\D/g,'').length!==12)e.phone=T.phoneError;if(form.username&&!/^@?[a-zA-Z][a-zA-Z0-9_]{4,31}$/.test(form.username))e.username=T.usernameError;if(form.dob&&age(form.dob)<18){if(!form.parentName.trim())e.parentName=T.required;if(form.parentPhone.replace(/\D/g,'').length!==12)e.parentPhone=T.phoneError}return markErrors(e)}
function submitForm(skip){collectForm();if(form.step===0){if(!validatePersonal())return;form.step=1;render();window.scrollTo(0,0);return}if(form.step===1){if(!form.types.length){$('#typeError').textContent=T.treatmentError;haptic('notificationOccurred','error');return}form.step=2;render();window.scrollTo(0,0);return}if(!skip&&(!form.time||isBusy(form.doctor,form.date,form.time))){$('#slotError').textContent=form.time?T.conflict:T.slotError;haptic('notificationOccurred','error');return}const old=form.id?patient(form.id):null;const p={...(old||{id:uid(),stage:0,progress:0,created:today(),installed:today(),end:add(365),lastActivation:today(),teeth:Object.fromEntries([...FDI,...MILK].map(n=>[n,'healthy'])),history:[],plan:[],important:false}),...Object.fromEntries(['name','dob','sex','phone','username','parentName','parentPhone','types','complaints','allergies','chronic','source','doctor'].map(k=>[k,form[k]])),diagnosis:old?.diagnosis||T.diagnoses[form.types[0]]};p.name=p.name.trim();p.username=p.username.replace(/^@/,'');if(old)db.patients[db.patients.indexOf(old)]=p;else db.patients.push(p);if(!skip)db.appointments.push({id:uid(),patient:p.id,doctor:form.doctor,date:form.date,time:form.time,procedure:T.stages[0],status:0});persist();successId=p.id;form=null;tgCall('6.2','disableClosingConfirmation');haptic('notificationOccurred','success');if(old){go('/patient/'+p.id);toast(T.saved)}else go('/success')}
function saveBooking(){if(!booking.time||isBusy(booking.doctor,booking.date,booking.time)){const e=$('#slotError');if(e)e.textContent=booking.time?T.conflict:T.slotError;haptic('notificationOccurred','error');return}const p=patient(booking.patient);if(!p)return;db.appointments.push({id:uid(),patient:p.id,doctor:booking.doctor,date:booking.date,time:booking.time,procedure:T.procedures[booking.service||p.types[0]]||T.stages[0],status:0});persist();day=booking.date;booking=null;haptic('notificationOccurred','success');go('/schedule');toast(T.bookSuccess)}
function back(){if($('#overlay').innerHTML){closeSheet();return}if(route==='/new'&&form){collectForm();if(form.step>0){form.step--;render();window.scrollTo(0,0)}else if(form.dirty)ask(T.leave,()=>{form=null;go('/patients')});else{form=null;go('/patients')}return}if(route==='/book'&&booking?.step===1){booking.step=0;render();return}go(route.startsWith('/patient/')?'/patients':'/home')}
function startBooking(id){booking={step:id?1:0,patient:id||'',doctor:id?patient(id).doctor:'d1',date:add(1),time:'',query:''};go('/book')}
async function action(a){const [k,v,z]=a.split(':');if(['home','patients','schedule','more','my-treatment'].includes(k)){haptic();if(k==='schedule'){day=today();weekOffset=0}go('/'+k);return}if(k==='back')return back();if(k==='main')return formAction?.();if(k==='secondary')return secondaryAction?.();if(k==='close')return closeSheet();if(k==='confirm'){let cb=confirmCallback;confirmCallback=null;closeSheet();return cb?.()}if(k==='patient'){patientTab=0;milk=age(patient(v)?.dob||today())<12;go('/patient/'+v);return}if(k==='new'||k==='edit'){form=newForm(k==='edit'?v:'');go('/new');return}if(k==='book')return startBooking(v);if(k==='kpi'){filters=blankFilters();query='';if(v==='today'){scheduleDoctor='';day=today();weekOffset=0;go('/schedule')}else{if(v!=='all')filters.types=[v];go('/patients')}return}if(k==='attention'){filters=blankFilters();query='';if(v==='debt')filters.payment='debt';else filters.attention=v;go('/patients');return}if(k==='chip'){filters.types=v?[v]:[];haptic();render();return}if(k==='resetFilters'){filters=blankFilters();query='';render();return}if(k==='removeFilter'){if(v==='types')filters.types=filters.types.filter(t=>t!==z);else filters[v]='';render();return}if(k==='filters')return filterSheet();if(k==='filterType'){filterDraft.types=filterDraft.types.includes(v)?filterDraft.types.filter(t=>t!==v):[...filterDraft.types,v];haptic();drawFilters();return}if(k==='filterValue'){filterDraft[v]=String(filterDraft[v])===z?'':z;haptic();drawFilters();return}if(k==='filterReset'){filterDraft=blankFilters();drawFilters();return}if(k==='filterApply'){filters=filterDraft;closeSheet();render();return}if(k==='star'){const p=patient(v);p.important=!p.important;persist();haptic();const sy=scrollY;render();scrollTo(0,sy);return}if(k==='tab'){patientTab=+v;haptic();const sy=scrollY;render();scrollTo(0,sy);return}if(k==='teethMode'){milk=v==='1';render();return}if(k==='tooth'){const p=patient(v);showSheet(T.tooth(z),`<div class="stack">${Object.entries(T.toothStates).map(([s,t])=>`<button class="btn ${p.teeth[z]===s?'soft':''}" data-act="toothState:${v}:${z}:${s}"><i style="width:8px;height:8px;border-radius:50%;background:${stateColor(s)}"></i>${t}</button>`).join('')}</div>`);return}if(k==='toothState'){const s=a.split(':')[3];patient(v).teeth[z]=s;persist();closeSheet();const sy=scrollY;render();scrollTo(0,sy);haptic('notificationOccurred','success');return}if(k==='copy'){try{await navigator.clipboard.writeText(patient(v).phone);toast(T.copied)}catch{toast(T.copyFail)}return}if(k==='telegram'){const name=patient(v).username;if(name&&can('6.1'))tg.openTelegramLink('https://t.me/'+name);else if(name)showSheet(T.telegram,`<p class="small" style="padding:15px 0">@${esc(name)}</p><p class="small muted">${T.demoOnly}</p>`);else toast(T.noUsername);return}if(k==='delete'){ask(T.removeConfirm,()=>{db.patients=db.patients.filter(p=>p.id!==v);db.appointments=db.appointments.filter(a=>a.patient!==v);persist();go('/patients');toast(T.removed)});return}if(k==='remind'){const p=patient(v),n=nextAppt(p);if(!n){toast(T.noNext);return}showSheet(T.reminder,`<span class="label">${T.bot}</span><div class="bubble">${esc(T.reminderText(p.name.split(' ')[0],date(n.date),n.time,n.procedure,doc(n.doctor).name))}<div class="actions">${btn(T.confirm,'previewConfirm','soft')}${btn(T.reschedule,'previewReschedule','soft')}</div></div><p class="small muted">${T.demoOnly}</p>`,btn(T.send,'sendReminder','primary'));return}if(['previewConfirm','previewReschedule'].includes(k)){toast(T.demoOnly);return}if(k==='sendReminder'){closeSheet();toast(T.sent);haptic('notificationOccurred','success');return}if(k==='status'){showSheet(T.statusTitle,`<div class="stack">${T.statuses.map((t,i)=>btn(t,'setStatus:'+v+':'+i,i===db.appointments.find(a=>a.id===v)?.status?'soft':'')).join('')}</div>`);return}if(k==='setStatus'){const ap=db.appointments.find(x=>x.id===v),p=patient(ap.patient);ap.status=+z;if(+z===1&&!p.history.some(h=>h.appointment===ap.id)){p.history.unshift({id:uid(),appointment:ap.id,date:ap.date,doctor:ap.doctor,procedure:ap.procedure,note:T.notes[0],amount:150000});if(p.types.some(t=>['braces','plate','aligners'].includes(t)))p.lastActivation=ap.date}persist();closeSheet();render();toast(T.statusSaved);return}if(k==='day'){day=v;haptic();render();return}if(k==='week'){weekOffset+=+v;day=add(weekOffset*7);render();return}if(k==='formType'){collectForm();form.types=form.types.includes(v)?form.types.filter(t=>t!==v):[...form.types,v];form.dirty=true;render();return}if(k==='complaint'){collectForm();form.complaints=[form.complaints,T.quickComplaints[+v]].filter(Boolean).join('. ');form.dirty=true;render();return}if(['formDoctor','formDate','formTime','bookDoctor','bookDate','bookTime'].includes(k)){const f=k.startsWith('form')?form:booking;if(k.endsWith('Doctor')){f.doctor=v;f.time=''}else if(k.endsWith('Date')){f.date=v;f.time=''}else f.time=v+':'+z;if(f===form)f.dirty=true;haptic();const sy=scrollY;render();scrollTo(0,sy);return}if(k==='bookPatient'){booking.patient=v;booking.doctor=patient(v).doctor;booking.step=1;render();scrollTo(0,0);return}if(k==='theme'){theme=v;try{localStorage.setItem('dent_theme',JSON.stringify(v))}catch{}setTheme();render();return}if(k==='mode'){mode=v;go('/home');return}if(k==='profile'){const d=doc(v);showSheet(T.profile,`<div class="detail-head">${avatar(d,true)}<h2>${d.name}</h2><p class="small muted mt">${d.specialty}</p></div><div class="card mt">${info(T.experience,T.yearsExperience)}${info(T.schedule,T.workHours)}${info(T.clinic,'DENTA · Ташкент')}</div>`);return}if(k==='install'){if(can('8.0')&&tg.addToHomeScreen)tg.addToHomeScreen();else showSheet(T.homeScreen,`<p class="small" style="line-height:1.9;margin:15px 0">${T.homeScreenHint}</p>`);return}if(k==='about'){showSheet(T.about,`<p class="small" style="line-height:1.9;margin:15px 0">${T.aboutText}</p>`);return}if(k==='resetData'){ask(T.resetConfirm,()=>{db=seed();persist();filters=blankFilters();query='';render();toast(T.resetDone)});return}if(k==='patientBook'||k==='service'){if(db.patients[0]){startBooking(db.patients[0].id);if(k==='service'){booking.service=v;booking.doctor=['implant','removal','crown'].includes(v)?'d3':['caries','hygiene'].includes(v)?'d2':'d1'}}else{form=newForm();go('/new')}return}}
document.addEventListener('click',e=>{if(e.target.classList.contains('sheet-overlay')){closeSheet();return}const b=e.target.closest('[data-act]');if(b&&!b.disabled){e.preventDefault();haptic('impactOccurred','light');action(b.dataset.act)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#results').innerHTML=resultsHTML()}if(e.target.id==='bookSearch'){booking.query=e.target.value;$('#bookResults').innerHTML=bookResults()}if(e.target.closest('#patientForm')){if(['phone','parentPhone'].includes(e.target.name))e.target.value=phoneMask(e.target.value);collectForm();form.dirty=true;tgCall('6.2','enableClosingConfirmation');if(e.target.name==='dob'){$('#ageHint').textContent=form.dob?T.ageText(age(form.dob)):'';$('#parentFields').innerHTML=parentFields()}}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value;$('#results').innerHTML=resultsHTML()}if(e.target.id==='scheduleDoctor'){scheduleDoctor=e.target.value;render()}if(e.target.closest('#patientForm')){collectForm();form.dirty=true;tgCall('6.2','enableClosingConfirmation')}});document.addEventListener('submit',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML)closeSheet();if(e.key==='Tab'&&$('#overlay').innerHTML){const f=[...$('.sheet').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let approvedHash='';window.addEventListener('hashchange',()=>{if(route==='/new'&&form?.dirty&&location.hash!=='#/new'&&approvedHash!==location.hash){const target=location.hash;history.replaceState(null,'','#/new');ask(T.leave,()=>{form=null;approvedHash=target;location.hash=target});return}approvedHash='';render();scrollTo(0,0)});window.addEventListener('beforeunload',e=>{if(form?.dirty){e.preventDefault();e.returnValue=''}});if(!location.hash)history.replaceState(null,'','#/home');setTimeout(()=>{render();if(!low)$$('[data-count]').forEach(el=>{const n=+el.dataset.count,start=performance.now();function step(now){let f=Math.min(1,(now-start)/500);el.textContent=Math.round(n*(1-(1-f)**3));if(f<1&&el.isConnected)requestAnimationFrame(step)}requestAnimationFrame(step)})},600);
