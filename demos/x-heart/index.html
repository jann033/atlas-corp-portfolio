function payment(){const o=currentOrder();if(!o)return empty('demoEmpty');if(o.payStatus!=='awaiting')return heading('payment')+`<div class="panel center"><span class="status ${o.payStatus==='paid'?'active':''}">${t(o.payStatus)}</span><p>${t('order')} XH-${o.id}</p>${o.payStatus==='expired'?`<p class="muted">${t('expiredNote')}</p>${btn('returnCart','returnOrder:'+o.id,'btn primary')}`:btn('orders','orders','btn primary')}</div>`;return heading('payment')+`<div class="label muted">${t('order')} XH-${o.id}</div><p>${t('payNow')}</p><div class="bigprice">${money(o.total/2)}</div><p class="muted">${t('deliveryExtra')}</p><div class="panel payment-card"><div class="label muted">${t('cardNumber')}</div><div class="cardnumber">${PAYMENT.card}</div><p>${PAYMENT.holder} · ${PAYMENT.bank}</p>${btn(S.copied?'copied':'copyCard','copy','btn primary full','id="copy-button"')}</div><div class="timer" id="timer">${timerHTML(o)}</div><ol class="steps">${['step1','step2','step3'].map(k=>`<li>${t(k)}</li>`).join('')}</ol><label class="upload">${o.receipt?`<img class="receipt" src="${o.receipt}" alt="${t('receiptPreview')}"><span>${t('replace')}</span>`:`<span>${t('attach')}</span>`}<input id="receipt" type="file" accept="image/*" aria-label="${t(o.receipt?'replace':'attach')}"></label>${btn('help','contact','textbtn full')}${dock(btn(o.receipt?'sendReceipt':'attachFirst','sendReceipt','btn primary',o.receipt&&!o.receiptPending?'':'disabled'))}`;}
function receiptSent(){return heading('receiptSent')+`<div class="center"><div class="successmark">✓</div><div class="label muted">${t('order')} XH-${S.order}</div><h1 style="margin-top:20px">${t('receiptSent')}</h1><span class="status">${t(currentOrder()?.payStatus||'checking')}</span><p style="margin:24px 0">${t('confirmHour')}</p><div class="stack">${btn('orders','orders','btn primary')}${btn('toCatalog','catalog')}</div></div>`;}
function tracker(o){return `<div class="tracker ${o.payStatus!=='paid'?'locked':''}">${['collect','buy','warehouse','transit','issue'].map((k,i)=>`<div class="stage"><i class="point ${i<2?'passed':''} ${i===1?'current':''}"></i>${t(k)}</div>`).join('')}</div>`;}
function orders(){
 const accent=S.orders.find(o=>o.payStatus==='paid'&&!o.past)?.id;
 return heading('orders')+(S.orders.length?`<div class="stack">${S.orders.map(o=>o.past?`<details class="panel"><summary>${t('pastOrder')} · XH-${o.id}<br><small>${t('received')} · ${t('pastDate')}</small></summary>${orderItems(o)}<div class="price" style="margin-top:16px">${money(o.total)}</div></details>`:`<div class="panel"><div class="row"><strong>XH-${o.id}</strong><small>${t('orderDate')}</small></div><div class="row" style="margin-top:12px"><span class="status ${o.id===accent?'metal':o.payStatus}">${o.id===accent?metalLayer():''}${t(o.payStatus)}</span>${o.payStatus==='awaiting'?btn('pay','payment:'+o.id,'btn'):''}</div>${o.payStatus==='expired'?`<p class="muted" style="margin-top:16px">${t('expiredNote')}</p>${btn('returnCart','returnOrder:'+o.id,'btn full')}`:`${tracker(o)}${o.payStatus!=='paid'?`<p class="muted">${t('statusNote')}</p>`:''}<small>${t('expected')}: ${t(DROPS[0].delivery)}</small>`}${orderItems(o)}<div class="row" style="margin-top:16px"><span class="price">${money(o.total)}</span><small>${t(o.method)}</small></div></div>`).join('')}</div>`:empty('emptyOrders'));
}
function orderItems(o){return `<div class="minis">${o.items.map(x=>`<button class="thumb" style="width:52px" data-a="product:${x.id}" aria-label="${pname(prod(x.id))}">${photo(prod(x.id),x.v)}</button>`).join('')}</div>`;}
function profile(){const name=S.user?.first_name||t('guest');return `<h1>${t('profile')}</h1><div class="profilehead"><div class="avatar">${esc(name[0])}</div><div><h2 style="margin:0 0 4px">${esc(name)}</h2><small>${S.user?.username?'@'+esc(S.user.username):t('guestHandle')}</small></div></div>${[['orders','orders'],['favorites','favorites'],['sizeTable','sheet:1'],['deliveryPayment','info'],['contact','contact']].map(([k,a])=>`<button class="menu" data-a="${a}">${t(k)}${icon('arrow')}</button>`).join('')}<div class="section-label">${t('language')}</div><div class="segments">${['ru','uz'].map(k=>btn(k,'lang:'+k,S.lang===k?'active':'','aria-pressed="'+(S.lang===k)+'"')).join('')}</div><div class="section-label">${t('theme')}</div><div class="segments">${['auto','light','dark'].map(k=>btn(k,'theme:'+k,S.theme===k?'active':'','aria-pressed="'+(S.theme===k)+'"')).join('')}</div><p class="muted" style="margin-top:28px">${t('version')}</p>${btn('demo','demo','demo')}`;}
function info(){return heading('deliveryPayment')+`<div class="panel"><h3>${t('drops')}</h3><p>${t('business')}</p><h3>${t('deposit')}</h3><p>${t('paymentNote')}</p>${['pickup','city','region'].map((m,i)=>`<div class="row" style="padding:12px 0"><span>${t(m)}</span><span>${i?money(i===1?25000:40000):t('free')}</span></div>`).join('')}</div><div class="notice" style="margin-top:16px"><strong>${t('noReturns')}</strong>${t('returnsNote')}</div>`;}
function render(preserve=true){expireOrders();persistCommerce();document.body.dataset.screen=S.screen;const y=window.scrollY,focus=document.activeElement,focusId=focus?.id,start=focus?.selectionStart;document.documentElement.lang=S.lang;applyTheme();const navTab=['product','favorites'].includes(S.screen)?'catalog':['checkout','payment','sent'].includes(S.screen)?'cart':['orders','info'].includes(S.screen)?'profile':['look','editorial'].includes(S.screen)?'home':S.screen;const nested=S.stack.length>0||!['home','catalog','cart','profile'].includes(S.screen);const docked=['product','look','checkout','payment'].includes(S.screen)||(S.screen==='cart'&&S.cart.length);document.getElementById('app').innerHTML=`<header class="header"><button class="brand" data-a="home" aria-label="${t('home')}">${logo()}<b>${t('brand')}</b></button>${ib('heart','favorites','favorites')}<button class="icon" data-a="lang" aria-label="${t('language')}">${t(S.lang+'Code')}</button>${ib(document.body.classList.contains('dark')?'sun':'moon','theme','theme')}</header><main class="content ${docked?'with-dock':''}" id="main">${({home,catalog,product,look:lookPage,favorites:()=>heading('favorites')+(S.favorites.length?`<div class="grid">${S.favorites.map(id=>card(prod(id),true)).join('')}</div>`:empty('emptyFavorites')),cart,checkout,payment,sent:receiptSent,orders,profile,info,editorial}[S.screen]||home)()}</main><nav class="tabs glass" aria-label="${t('nav')}">${['home','catalog','cart','profile'].map(k=>`<button data-a="${k}" ${navTab===k?'aria-current="page"':''}><span class="navicon ${navTab===k?'metal':''}">${navTab===k?metalLayer():''}${icon(k)}</span><span>${t(k)}</span>${k==='cart'&&S.cart.length?`<span class="badge">${S.cart.reduce((n,x)=>n+x.n,0)}</span>`:''}</button>`).join('')}</nav>`;const floating=document.querySelector('#main .dock');if(floating)document.getElementById('app').appendChild(floating);if(S.screen==='product'){const slides=document.getElementById('slides');slides.scrollLeft=slides.clientWidth*S.slide;slides.addEventListener('scroll',()=>{S.slide=Math.max(0,Math.min(2,Math.round(slides.scrollLeft/slides.clientWidth)));const count=document.getElementById('gallery-count');if(count)count.textContent=(S.slide+1)+' / 3';document.querySelectorAll('.dots button').forEach((b,i)=>b.classList.toggle('selected',i===S.slide));},{passive:true});}renderSheet();showToast();syncBackButton();if(preserve)window.scrollTo(0,y);if(focusId){const el=document.getElementById(focusId);if(el&&el.tagName==='INPUT'&&el.type!=='file'){el.focus({preventScroll:true});try{el.setSelectionRange(start,start);}catch{}}}}
function navigate(screen,props={},tab=false){if(S.screen==='catalog')S.catalogScroll=window.scrollY;if(!tab)S.stack.push({screen:S.screen,id:S.id,look:S.look,order:S.order,slide:S.slide,y:window.scrollY});else S.stack=[];Object.assign(S,props,{screen,sheet:null});render(false);window.scrollTo(0,screen==='catalog'?S.catalogScroll:0);}
function back(){if(S.sheet){closeSheet();return;}const previous=S.stack.pop();if(previous){Object.assign(S,previous);render(false);window.scrollTo(0,previous.y);}else navigate('home',{},true);}
function haptic(){try{tg?.HapticFeedback?.impactOccurred('light');}catch{}}
function applyTheme(){const dark=S.theme==='auto'?(tg?tg.colorScheme==='dark':matchMedia('(prefers-color-scheme:dark)').matches):S.theme==='dark';document.body.classList.toggle('dark',dark);document.querySelector('meta[name="theme-color"]').content=dark?'#0A0A0B':'#F4F3F1';}
// localStorage + резерв в памяти: корзина и заказы сохраняются без зависимости от SDK.
function localGet(k){if(Object.prototype.hasOwnProperty.call(S.memory,k))return S.memory[k];try{return localStorage.getItem('xh-'+k)||null;}catch{return null;}}
function localSet(k,v){S.memory[k]=v;try{localStorage.setItem('xh-'+k,v);}catch{}}
function getPref(k){return new Promise(resolve=>{let done=false;const finish=v=>{if(!done){done=true;resolve(v||localGet(k));}};try{if(tg?.CloudStorage?.getItem){tg.CloudStorage.getItem(k,(err,v)=>finish(err?null:v));setTimeout(()=>finish(null),600);}else finish(null);}catch{finish(null);}});}
function savePref(k,v){S.memory[k]=v;try{if(tg?.CloudStorage?.setItem){let done=false;tg.CloudStorage.setItem(k,v,err=>{done=true;if(err)localSet(k,v);});setTimeout(()=>{if(!done)localSet(k,v);},600);}else localSet(k,v);}catch{localSet(k,v);}}
function preference(k,v){S[k]=v;S.revisions[k]++;savePref(k,v);haptic();render();}
function toast(key){S.toast=key;clearTimeout(S.toastTimer);showToast();S.toastTimer=setTimeout(()=>{S.toast=null;showToast();},2400);}
function showToast(){const el=document.getElementById('toast');el.className=S.toast?'toast':'';el.textContent=S.toast?t(S.toast):'';}
function addItem(x){if(!Number.isSafeInteger(x.n)||x.n<1)return;let remaining=x.n;for(const old of S.cart.filter(y=>y.id===x.id&&y.v===x.v&&y.size===x.size&&y.n<99)){const amount=Math.min(99-old.n,remaining);old.n+=amount;remaining-=amount;if(!remaining)return;}while(remaining){const n=Math.min(99,remaining);S.cart.push({id:x.id,v:x.v,size:x.size,n});remaining-=n;}}
function toggle(arr,value){const i=arr.indexOf(value);if(i<0)arr.push(value);else arr.splice(i,1);}
async function copyCard(){let success=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(PAYMENT.card.replace(/ /g,''));success=true;}}catch{}if(!success){const a=document.createElement('textarea');a.value=PAYMENT.card.replace(/ /g,'');a.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(a);try{a.select();success=document.execCommand('copy');}catch{}a.remove();}if(success){haptic();S.copied=true;render();clearTimeout(S.copyTimer);S.copyTimer=setTimeout(()=>{S.copied=false;const b=document.getElementById('copy-button');if(b)b.textContent=t('copyCard');},1500);}else toast('copyError');}
function contact(){try{if(tg?.openTelegramLink&&tg.initData){tg.openTelegramLink('https://t.me/xheartuz');return;}}catch{}toast('contactToast');}
function confirmOrder(){S.errors={};if(!S.form.name.trim())S.errors.name='requiredName';if(S.form.phone.replace(/\D/g,'').length!==9)S.errors.phone='requiredPhone';if(S.form.method==='region'&&S.form.area==='')S.errors.area='requiredArea';if(S.form.method!=='pickup'&&!S.form.address.trim())S.errors.address='requiredAddress';if(Object.keys(S.errors).length){render();const el=document.getElementById('field-'+Object.keys(S.errors)[0]);el?.focus();el?.scrollIntoView({block:'center',behavior:'auto'});return;}if(!S.cart.length){navigate('cart',{},true);return;}const id=Math.max(1040,...S.orders.map(o=>o.id))+1;const o={id,payStatus:'awaiting',items:S.cart.map(x=>({...x})),total:sum(S.cart),fee:fee(),method:S.form.method,customer:{...S.form},expires:Date.now()+PAYMENT.minutes*60000,receipt:null};S.orders.unshift(o);S.cart=[];S.errors={};S.stack=S.stack.filter(x=>x.screen!=='checkout');navigate('payment',{order:id});S.stack=S.stack.filter(x=>x.screen!=='checkout');toast('created');}
function maskPhone(raw){let d=raw.replace(/\D/g,'');if(raw.trim().startsWith('+998')||(d.length===12&&d.startsWith('998')))d=d.slice(3);return d.slice(0,9);}
function phoneDisplay(d){return '+998 '+[d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean).join(' ');}
function openSheet(id){S.sheetOpener=document.activeElement;S.sheet=Number(id);syncBackButton();S.fit={height:'',weight:'',result:'',error:false};renderSheet();document.getElementById('sheet-close')?.focus();}
function closeSheet(){S.sheet=null;renderSheet();syncBackButton();if(S.sheetOpener?.isConnected)S.sheetOpener.focus({preventScroll:true});else document.querySelector('[data-a^="sheet:"]')?.focus({preventScroll:true});S.sheetOpener=null;}
function sizeRows(p){return p.cat==='shoes'?p.sizes.map((z,i)=>[z,24.5+i*.5]):p.cat==='jeans'?CLOTH.map((z,i)=>[z,74+i*5,75+i*2,25+i*1.5]):CLOTH.map((z,i)=>[z,108+i*6,68+i*2,58+i*2]);}
function renderSheet(){const root=document.getElementById('modal');document.body.style.overflow=S.sheet?'hidden':'';document.getElementById('app').inert=!!S.sheet;if(!S.sheet){root.innerHTML='';return;}const p=prod(S.sheet),shoe=p.cat==='shoes',accessory=p.cat==='accessories';root.innerHTML=`<div class="overlay" data-a="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head" id="sheet-head"><div class="handle"></div><div class="row"><h2 id="sheet-title">${t('sizesTitle')}</h2><button id="sheet-close" class="icon" data-a="closeSheet" aria-label="${t('close')}">${icon('close')}</button></div><p class="muted">${t('bodyNote')} · ${t('cm')}</p></div>${accessory?`<p>${t('fitAccessory')}</p>`:`<table><thead><tr>${['size',...(shoe?['foot']:p.cat==='jeans'?['waist','inseam','leg']:['chest','length','sleeve'])].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${sizeRows(p).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}${shoe?`<p class="muted">${t('fitShoes')}</p>`:accessory?'':`<h2>${t('fit')}</h2><div class="fitfields">${['height','weight'].map(k=>`<label class="field"><span>${t(k)}, ${t(k==='height'?'cm':'kg')}</span><input type="number" inputmode="decimal" id="fit-${k}" data-fit="${k}" value="${esc(S.fit[k])}"></label>`).join('')}</div>${btn('pick','fit','btn primary full')}<div id="fit-result" role="status">${fitResult()}</div>`}</section></div>`;let startY=0;const head=document.getElementById('sheet-head');head.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;},{passive:true});head.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-startY>70)closeSheet();},{passive:true});}
function fitResult(){return S.fit.error?`<p class="error">${t('fitError')}</p>`:S.fit.result?`<p><strong>${t('recommend')} ${S.fit.result}</strong></p><p class="muted">${t('chinaNote')}</p>`:'';}
function recommend(){const h=Number(S.fit.height),w=Number(S.fit.weight);S.fit.error=!(h>=120&&h<=230&&w>=30&&w<=200);S.fit.result='';if(!S.fit.error){let i=w<=55?0:w<=65?1:w<=78?2:w<=92?3:4;i+=h>185?1:h<165?-1:0;i=Math.max(0,Math.min(4,i));const p=prod(S.sheet),available=CLOTH.map((s,n)=>({s,n})).filter(x=>p.sizes.includes(x.s)&&!p.unavailable.includes(x.s));S.fit.result=available.sort((a,b)=>Math.abs(a.n-i)-Math.abs(b.n-i)||a.n-b.n)[0].s;}document.getElementById('fit-result').innerHTML=fitResult();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const [a,b,c]=el.dataset.a.split(':');switch(a){case'overlay':if(e.target===el)closeSheet();break;case'closeSheet':closeSheet();break;case'back':back();break;case'home':case'catalog':case'cart':case'profile':navigate(a,{},true);break;case'search':navigate('catalog',{},true);document.getElementById('query')?.focus();break;case'favorites':case'orders':case'info':navigate(a);break;case'product':navigate('product',{id:Number(b),slide:0});break;case'look':navigate('look',{look:Number(b)});break;case'drop':S.filters.drop=Number(b);S.catalogScroll=0;navigate('catalog',{},false);break;case'cat':toggle(S.filters.cats,b);render();break;case'filterSize':toggle(S.filters.sizes,b);render();break;case'reset':S.filters={q:'',cats:[],sizes:[],drop:null};render();break;case'favorite':toggle(S.favorites,Number(b));haptic();render();break;case'lang':preference('lang',b||(S.lang==='ru'?'uz':'ru'));break;case'theme':preference('theme',b||(document.body.classList.contains('dark')?'light':'dark'));break;case'variant':sel(prod(S.id)).v=Number(b);render();break;case'size':if(!prod(S.id).unavailable.includes(b)){sel(prod(S.id)).size=b;haptic();render();}break;case'slide':S.slide=Number(b);document.getElementById('slides').scrollTo({left:Number(b)*document.getElementById('slides').clientWidth,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});break;case'sheet':openSheet(b);break;case'fit':recommend();break;case'add':{const p=prod(S.id),s=sel(p);if(!s.size)return;addItem({id:p.id,v:s.v,size:s.size,n:1});haptic();render();toast('added');break;}case'addLook':{const xs=lookState(LOOKS[S.look]).filter(x=>x.take);if(!xs.length||xs.some(x=>!x.size))return;xs.forEach(addItem);haptic();render();toast('added');break;}case'qty':S.cart[Number(b)].n=Math.max(1,Math.min(99,S.cart[Number(b)].n+Number(c)));render();break;case'remove':S.cart.splice(Number(b),1);render();break;case'checkout':if(S.cart.length)navigate('checkout');break;case'payment':navigate('payment',{order:Number(b)});break;case'copy':copyCard();break;case'returnOrder':returnOrder(b);break;case'editorial':navigate('editorial',{editorialIdx:Number(b)});break;case'editorialSelect':S.editorialIdx=Number(b);render();window.scrollTo(0,0);break;case'sendReceipt':{const o=currentOrder();if(!o)return;expireOrders();if(o.payStatus==='expired'){render();toast('demoExpired');return;}if(!o.receipt||o.receiptPending||o.payStatus!=='awaiting')return;o.payStatus='checking';navigate('sent');break;}case'contact':contact();break;case'demo':{ /* Временная демо-кнопка заменяет ручное подтверждение магазином. */ const o=S.orders.find(x=>!x.mock);if(!o){toast('demoEmpty');return;}expireOrders();if(o.payStatus==='expired'){render();toast('demoExpired');return;}o.payStatus='paid';haptic();render();toast('demoDone');break;}}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='query'){S.filters.q=el.value;document.getElementById('results').innerHTML=catalogResults();}if(el.dataset.field){const k=el.dataset.field;S.form[k]=k==='phone'?maskPhone(el.value):el.value;if(k==='phone'){const raw=el.value,pos=el.selectionStart??raw.length,end=pos===raw.length,digits=raw.slice(0,pos).replace(/\D/g,'').length;el.value=phoneDisplay(S.form.phone);let caret=el.value.length;if(!end){let count=0;caret=0;while(caret<el.value.length&&count<digits){if(/\d/.test(el.value[caret]))count++;caret++;}}el.setSelectionRange(caret,caret);}if(S.errors[k]){delete S.errors[k];el.classList.remove('invalid');el.setAttribute('aria-invalid','false');el.parentElement.querySelector('.error')?.remove();}}if(el.dataset.fit)S.fit[el.dataset.fit]=el.value;});

function photoImage(asset,label){
 if(S.assetFailures.has(asset.file))return '';

 else image=`<img class="photo-image" src="${asset.file}" alt="${esc(label)}" loading="lazy" decoding="async" onload="this.closest('.photo')?.classList.add('loaded')" onerror="photoFailed(this)">`;
 return `<div class="photo-media">${image}</div>`;
}
function photoFailed(img){S.assetFailures.add(img.getAttribute('src'));const photo=img.closest('.photo');photo?.classList.remove('has-photo');img.closest('.photo-media')?.remove();}

function editorial(){const idx=Math.max(0,Math.min(EDITORIALS.length-1,S.editorialIdx)),e=EDITORIALS[idx];return heading('inspiration')+`<div class="editorial-page"><div class="editorial-photo">${e.crop?`<div class="photo" style="aspect-ratio:${e.crop.w/e.crop.h}">${editorialImage(e.file,e.crop,t(e.title))}</div>`:`<img src="${e.file}" alt="${t(e.title)}" decoding="async">`}</div><h1>${t(e.title)}</h1><p class="muted">${t('inspirationNote')}</p><div class="editorial-thumbs">${EDITORIALS.map((x,i)=>`<button data-a="editorialSelect:${i}" aria-label="${t(x.title)}" aria-current="${i===idx}"><img src="${x.file}" alt="" loading="lazy"></button>`).join('')}</div>${btn('toCatalog','catalog','btn primary full')}</div>`;}

function cleanItems(items){if(!Array.isArray(items))return [];return items.slice(0,200).flatMap(x=>{if(!x||typeof x!=='object')return [];const p=prod(x.id);if(!p||!Number.isInteger(x.v)||!p.variants[x.v]||!p.sizes.includes(x.size)||p.unavailable.includes(x.size)||!Number.isInteger(x.n)||x.n<1||x.n>99)return [];return [{id:p.id,v:x.v,size:x.size,n:x.n}];});}
function cleanOrders(orders){if(!Array.isArray(orders))return [];const seen=new Set();return orders.slice(0,200).flatMap(o=>{if(!o||typeof o!=='object'||!Number.isSafeInteger(o.id)||o.id<1||seen.has(o.id)||!['awaiting','checking','paid','expired'].includes(o.payStatus))return [];const items=cleanItems(o.items);if(!items.length)return [];seen.add(o.id);const method=['pickup','city','region'].includes(o.method)?o.method:'pickup';return [{id:o.id,payStatus:o.payStatus,items,total:sum(items),method,fee:{pickup:0,city:25000,region:40000}[method],expires:Number.isFinite(o.expires)?o.expires:0,receipt:null,receiptKey:typeof o.receiptKey==='string'?o.receiptKey:null,mock:o.mock===true,past:o.past===true&&o.payStatus==='paid'}];});}
function restoreCommerce(){for(const key of ['cart','orders']){const raw=localGet(key);if(raw===null)continue;try{const parsed=JSON.parse(raw);S[key]=key==='cart'?cleanItems(parsed):cleanOrders(parsed);}catch{S[key]=[];}}S.commerceRestored=true;expireOrders();persistCommerce();}
function persistCommerce(){if(!S.commerceRestored)return;try{const cart=JSON.stringify(S.cart),orders=JSON.stringify(S.orders.map(({receipt,receiptPending,customer,...o})=>o));const snapshot=cart+'|'+orders;if(snapshot!==S.commerceSnapshot){localSet('cart',cart);localSet('orders',orders);S.commerceSnapshot=snapshot;}}catch{}}
function expireOrders(now=Date.now()){let changed=false;S.orders.forEach(o=>{if(o.payStatus==='awaiting'&&(!Number.isFinite(o.expires)||o.expires<=now)){o.payStatus='expired';changed=true;}});if(changed)persistCommerce();return changed;}
function returnOrder(id){const index=S.orders.findIndex(o=>o.id===Number(id));if(index<0||S.orders[index].payStatus!=='expired')return;const o=S.orders[index];o.items.forEach(addItem);S.orders.splice(index,1);if(o.receipt)URL.revokeObjectURL(o.receipt);if(o.receiptKey)receiptOperation('delete',o.receiptKey);persistCommerce();haptic();navigate('cart',{},true);toast('added');}
function receiptDatabase(){if(S.receiptDb)return S.receiptDb;S.receiptDb=new Promise(resolve=>{try{if(!window.indexedDB){resolve(null);return;}const request=indexedDB.open('xh-prototype-receipts',1);request.onupgradeneeded=()=>request.result.createObjectStore('receipts');request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);request.onblocked=()=>resolve(null);}catch{resolve(null);}});return S.receiptDb;}
async function receiptOperation(mode,key,value){try{const db=await receiptDatabase();if(!db)return null;return await new Promise(resolve=>{let result=null;try{const tx=db.transaction('receipts',mode==='get'?'readonly':'readwrite');const store=tx.objectStore('receipts');const r=mode==='get'?store.get(key):mode==='delete'?store.delete(key):store.put(value,key);r.onsuccess=()=>{result=mode==='get'?r.result:true;};tx.oncomplete=()=>resolve(result);tx.onerror=tx.onabort=()=>resolve(null);}catch{resolve(null);}});}catch{return null;}}
const receiptRevisions=new WeakMap();
async function chooseReceipt(file){
 if(!file)return;if(!file.type.startsWith('image/')){toast('checkImage');return;}if(file.size>15*1024*1024){toast('receiptTooLarge');return;}
 const o=currentOrder();if(!o||o.payStatus!=='awaiting')return;
 const sequence=(receiptRevisions.get(o)||0)+1;receiptRevisions.set(o,sequence);o.receiptPending=true;render();
 const preview=URL.createObjectURL(file);const decoded=await new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(true);img.onerror=()=>resolve(false);img.src=preview;});
 if(!S.orders.includes(o)||receiptRevisions.get(o)!==sequence){URL.revokeObjectURL(preview);return;}
 if(!decoded){URL.revokeObjectURL(preview);o.receiptPending=false;render();toast('receiptError');return;}
 const oldKey=o.receiptKey;if(o.receipt)URL.revokeObjectURL(o.receipt);o.receipt=preview;render();
 const key=`${o.id}-${Date.now()}-${sequence}`;const stored=await receiptOperation('put',key,file);
 if(!S.orders.includes(o)||receiptRevisions.get(o)!==sequence){if(stored)receiptOperation('delete',key);return;}
 if(stored){o.receiptKey=key;if(oldKey)receiptOperation('delete',oldKey);}else toast('receiptLocal');o.receiptPending=false;persistCommerce();if(S.screen==='payment'&&S.order===o.id)render();
}
async function restoreReceipts(){for(const o of S.orders){const key=o.receiptKey,revision=receiptRevisions.get(o);if(!key)continue;const blob=await receiptOperation('get',key);if(!S.orders.includes(o)||o.receiptKey!==key||receiptRevisions.get(o)!==revision)continue;if(blob instanceof Blob){o.receipt=URL.createObjectURL(blob);}else{o.receiptKey=null;}if(S.screen==='payment'&&S.order===o.id)render();}persistCommerce();}
